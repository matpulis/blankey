<svg xmlns="http://www.w3.org/2000/svg" width="560" height="150" viewBox="0 0 560 150" role="img" aria-label="blankey">
  <title>blankey</title>
  <defs>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="50%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- A terminal, because that is the whole idea. -->
  <rect x="16" y="27" width="96" height="96" rx="20" fill="#0B0F1A" stroke="url(#frame)" stroke-width="2.5"/>
  <circle cx="35" cy="45" r="3.4" fill="#F87171"/>
  <circle cx="47" cy="45" r="3.4" fill="#FBBF24"/>
  <circle cx="59" cy="45" r="3.4" fill="#34D399"/>
  <line x1="16" y1="58" x2="112" y2="58" stroke="#2E3548" stroke-width="1.5"/>
  <!-- a prompt chevron and a cursor -->
  <path d="M36 76 L50 87 L36 98" fill="none" stroke="#7C5CFF" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="59" y="80" width="30" height="8" rx="4" fill="#22D3EE"/>

  <text x="140" y="99"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace"
        font-size="66" font-weight="700" letter-spacing="1" fill="url(#wordmark)">blankey</text>
</svg>
